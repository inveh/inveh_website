<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Inveh Lighting Solutions</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
      // GitHub Pages SPA Redirect
      // When GitHub Pages 404s on a deep link (e.g. /product/INB001),
      // this page encodes the path as a query param and redirects to /,
      // where index.html restores it before Vue Router initialises.
      // Exception: Firebase internal /_/ paths are left alone (blocked by robots.txt anyway).
      (function () {
        var path = window.location.pathname;
        if (path.startsWith('/_/')) {
          // Do not redirect Firebase internal routes — let them 404 cleanly.
          document.title = '404 – Page Not Found';
          return;
        }
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.host + '/?p=' +
          encodeURIComponent(path) +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
